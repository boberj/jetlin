name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build

      # A test method that returns a value instead of Unit is silently ignored by JUnit rather than
      # failing, so a broken test can look like a passing one. Comparing what was declared against
      # what actually ran is the only thing that surfaces it.
      - name: Every declared test actually ran
        run: |
          declared=$(grep -rhcE '^[[:space:]]*@Test' --include='*.kt' */src/test | awk '{s+=$1} END {print s+0}')
          executed=$(cat */build/test-results/test/*.xml | grep -o 'testcase name=' | wc -l)
          echo "declared=$declared executed=$executed"
          if [ "$declared" -ne "$executed" ]; then
            echo "::error::$declared tests are declared but $executed ran; some were skipped silently"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: "*/build/reports/tests/test"

  client:
    name: Client bundle is current
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jetlin-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: jetlin-client/package-lock.json

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # jetlin.js is checked in so that consumers of the Gradle build never need npm. That only
      # works if it is kept in step with the TypeScript it was built from.
      - name: Rebuild and compare
        run: |
          npm run build
          if ! git diff --exit-code -- ../jetlin-server-ktor/src/main/resources/jetlin/jetlin.js; then
            echo "::error::jetlin.js is stale; run 'npm --prefix jetlin-client run build' and commit the result"
            exit 1
          fi

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start the demo
        run: |
          ./gradlew :samples:demo:installDist
          nohup samples/demo/build/install/demo/bin/demo > demo.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:8080/; then
              echo "demo is up"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the demo did not start within 60s"
          cat demo.log
          exit 1

      - name: Run Playwright
        working-directory: e2e
        run: npx playwright test
        env:
          JETLIN_URL: http://localhost:8080

      - name: Server log
        if: failure()
        run: cat demo.log

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
